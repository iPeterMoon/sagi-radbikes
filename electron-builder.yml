appId: com.radbikes.pos
productName: Rad Bikes
directories:
  output: dist

files:
  - electron/**/*

afterPack: scripts/afterPack.js

mac:
  target:
    - target: dmg
      arch:
        - x64
  category: public.app-category.business
  icon: build-assets/icon.icns
  identity: null

win:
  target: nsis
  icon: build-assets/icon.ico

linux:
  target: AppImage
  category: Office
