name: Build macOS Release

# Se dispara al pushear un tag que empiece con "v" (ej. v0.2.0).
# Ver RELEASING.md para el proceso completo de actualización de la tienda.
on:
  push:
    tags:
      - "v*"

jobs:
  build-mac:
    runs-on: macos-latest
    # El GITHUB_TOKEN por defecto es de solo lectura salvo que se declare acá;
    # sin esto, el paso de publicar el Release falla con "Resource not
    # accessible by integration".
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm ci

      - name: Generar runtime.env de producción
        run: |
          cat > runtime.env << EOF
          DATABASE_URL=${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL=${{ secrets.PROD_DIRECT_URL }}
          JWT_SECRET=${{ secrets.PROD_JWT_SECRET }}
          SESSION_TIMEOUT_HOURS=${{ secrets.PROD_SESSION_TIMEOUT_HOURS }}
          SUPABASE_URL=${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET_IMAGES=${{ secrets.PROD_SUPABASE_BUCKET_IMAGES }}
          PRINTER_INTERFACE=${{ secrets.PROD_PRINTER_INTERFACE }}
          PRINTER_NAME=${{ secrets.PROD_PRINTER_NAME }}
          EOF

      - name: Compilar app de Mac (.dmg)
        # next build ejecuta las rutas de API para recolectar sus datos estáticos,
        # así que necesita estas variables como env reales del proceso (no alcanza
        # con runtime.env, que solo lo lee Electron en tiempo de ejecución).
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
          DIRECT_URL: ${{ secrets.PROD_DIRECT_URL }}
          JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
          SESSION_TIMEOUT_HOURS: ${{ secrets.PROD_SESSION_TIMEOUT_HOURS }}
          SUPABASE_URL: ${{ secrets.PROD_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.PROD_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BUCKET_IMAGES: ${{ secrets.PROD_SUPABASE_BUCKET_IMAGES }}
          PRINTER_INTERFACE: ${{ secrets.PROD_PRINTER_INTERFACE }}
          PRINTER_NAME: ${{ secrets.PROD_PRINTER_NAME }}
        # --publish never: electron-builder publica automáticamente a GitHub
        # Releases cuando detecta que corrió a partir de un tag, y para eso
        # pide su propio GH_TOKEN. Ya tenemos un paso aparte (softprops/action-gh-release)
        # que hace esa publicación, así que acá se la desactivamos explícitamente.
        run: npm run electron:build -- --mac --publish never

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
          generate_release_notes: true
