services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  auth-service:
    build: ./services/auth
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}

  catalog-service:
    build: ./services/catalog
    ports:
      - "3002:3002"
    environment:
      - DATABASE_URL=${DATABASE_URL}

  pos-service:
    build: ./services/pos
    ports:
      - "3003:3003"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis:6379
      - CATALOG_SERVICE_URL=http://catalog-service:3002