services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  gateway-service:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/gateway:/app
      - /app/node_modules
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - POS_SERVICE_URL=http://pos-service:3003
      - FRONTEND_URL=http://localhost:3000
    command: sh -c "npm install && npm run dev"
    depends_on:
      - auth-service
      - catalog-service
      - pos-service
    restart: unless-stopped

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://gateway-service:8080/auth
      - CATALOG_SERVICE_URL=http://gateway-service:8080/catalog
      - POS_SERVICE_URL=http://gateway-service:8080/pos
    command: sh -c "npm install && npm run postinstall && npm run dev -- -H 0.0.0.0"
    depends_on:
      - redis
      - gateway-service
    restart: unless-stopped

  auth-service:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/auth:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped

  catalog-service:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/catalog:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped

  pos-service:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./services/pos:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CATALOG_SERVICE_URL=http://catalog-service:3002
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped
