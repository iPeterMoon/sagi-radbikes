services:
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.44
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--log.level=DEBUG"              # Útil para debug
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - traefik

  gateway-service:
    image: node:22-alpine
    container_name: gateway-service
    working_dir: /app
    volumes:
      - ./services/gateway:/app
      - /app/node_modules
    expose:
      - "8080"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gateway.rule=Host(`api.localhost`)"
      - "traefik.http.routers.gateway.entrypoints=web"
      - "traefik.http.services.gateway.loadbalancer.server.port=8080"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CATALOG_SERVICE_URL=http://catalog-service:3002
      - POS_SERVICE_URL=http://pos-service:3003
      - FRONTEND_URL=http://localhost
    command: sh -c "npm install && npm run dev"
    depends_on:
      - auth-service
      - catalog-service
      - pos-service
    restart: unless-stopped
    networks:
      - traefik

  frontend:
    image: node:22-alpine
    container_name: frontend
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    expose:
      - "3000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`localhost`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
    environment:
      - NODE_ENV=development
      - AUTH_SERVICE_URL=http://gateway-service:8080/auth
      - CATALOG_SERVICE_URL=http://gateway-service:8080/catalog
      - POS_SERVICE_URL=http://gateway-service:8080/pos
    command: sh -c "npm install && npm run postinstall && npm run dev -- -H 0.0.0.0"
    depends_on:
      - redis
      - gateway-service
    restart: unless-stopped
    networks:
      - traefik

  auth-service:
    image: node:22-alpine
    container_name: auth-service
    working_dir: /app
    volumes:
      - ./services/auth:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - traefik

  catalog-service:
    image: node:22-alpine
    container_name: catalog-service
    working_dir: /app
    volumes:
      - ./services/catalog:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - traefik

  pos-service:
    image: node:22-alpine
    container_name: pos-service
    working_dir: /app
    volumes:
      - ./services/pos:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CATALOG_SERVICE_URL=http://catalog-service:3002
    command: sh -c "npm install && npx prisma generate && npm run dev"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    driver: bridge